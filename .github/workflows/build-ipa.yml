name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - "Data/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare bundled data
        run: |
          mkdir -p Sources/Data
          cp Data/*.json Sources/Data/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (signing disabled)
        run: |
          xcodebuild -project KeibaSummary.xcodeproj \
            -scheme KeibaSummary \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry KeibaSummary-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KeibaSummary-unsigned-ipa
          path: KeibaSummary-unsigned.ipa
